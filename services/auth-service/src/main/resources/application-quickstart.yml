# 클론 직후 바로 실행하기 위한 기본값(기본 프로필). 환경변수로 덮어쓸 수 있으며, 실제 비밀값은 넣지 않습니다.
# 개인 설정은 gitignore 대상인 application-local.yml 에 두고 SPRING_PROFILES_ACTIVE=local 로 실행합니다.
server:
  port: 8081

spring:
  datasource:
    # docker-compose.local.yml 의 PostgreSQL은 호스트 5433 포트 (order-service DB와 충돌 방지)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:auth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            # 네이버 로그인을 실제로 쓰려면 환경변수로 발급받은 값을 넣습니다.
            client-id: ${NAVER_CLIENT_ID2:local-dummy-client-id}
            client-secret: ${NAVER_CLIENT_SECRET2:local-dummy-client-secret}
            redirect-uri: http://localhost:8000/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope: nickname,email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

oauth2:
  frontend-redirect-uri: http://localhost:3000/oauth/callback

mail:
  host: smtp.naver.com
  port: 465
  # 이메일 발송을 실제로 쓰려면 환경변수로 계정 정보를 넣습니다.
  username: ${MAIL_USERNAME:local-dummy}
  password: ${MAIL_PASSWORD:local-dummy}
  properties:
    mail:
      smtp:
        auth: true
        ssl:
          enable: true
          trust: smtp.naver.com
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

jwt:
  expiration:
    access: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh: ${JWT_REFRESH_EXPIRATION:1209600000}
  rsa:
    # [테스트 전용 키] 이 저장소에 공개된 키이므로 누구나 이 키로 토큰을 위조할 수 있습니다.
    # 이 프로필(quickstart)에서만 쓰이며, 개발·운영 서버는 JWT_RSA_PRIVATE_KEY 환경변수로 별도 키를 주입해야 합니다.
    # 로컬 외 환경(공유 서버, 외부 노출)에서 이 프로필을 켜지 마세요.
    private-key: ${JWT_RSA_PRIVATE_KEY:}

internal:
  gateway-secret: ${INTERNAL_GATEWAY_SECRET:local-dev-internal-secret}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
