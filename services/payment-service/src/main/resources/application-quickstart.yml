# 클론 직후 바로 실행하기 위한 기본값(기본 프로필). 환경변수로 덮어쓸 수 있으며, 실제 비밀값은 넣지 않습니다.
# 개인 설정은 gitignore 대상인 application-local.yml 에 두고 SPRING_PROFILES_ACTIVE=local 로 실행합니다.
spring:
  autoconfigure:
    exclude:
      - org.springframework.modulith.events.amqp.RabbitJackson2Configuration

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:payment}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:payment}
    password: ${DB_PASSWORD:payment}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:msa}
    username: ${RABBITMQ_USERNAME:payment-service}
    password: ${RABBITMQ_PASSWORD:payment1234}
    publisher-confirm-type: correlated
    publisher-returns: true

  modulith:
    events:
      externalization:
        enabled: true
      republish-outstanding-events-on-restart: false
      staleness:
        published: 1m
        processing: 5m
        resubmitted: 2m

bds:
  messaging:
    events:
      republish-delay: 30s
      republish-min-age: 1m
      retention: 7d

bank:
  api:
    # 로컬에는 은행 서버가 없으므로 자리표시 값. 은행 연동 API 호출 시에만 사용됩니다.
    base-url: ${BANK_URL:http://localhost:9090}

internal:
  gateway-secret: ${INTERNAL_GATEWAY_SECRET:local-dev-internal-secret}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

logging:
  level:
    com.bds.payment: DEBUG
